services:

  frontend:
    build:

      context: ../frontend
      args:
        VITE_API_URL: http://localhost:5000

    container_name: expense_frontend

    ports:

      - "5173:80"

    depends_on:
      - backend

  backend:
    build:
      context: ../backend

    container_name: expense_backend

    ports:
      - "5000:5000"

    env_file:
      - ../backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../backend:/app
    
    restart: on-failure

  postgres:
    image: postgres:17

    container_name: expense_postgres

    environment:

      POSTGRES_DB: expense_tracker

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: Myburger#300

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  postgres-data:
